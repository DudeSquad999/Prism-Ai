<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d"><title id="t">Prism AI 1.0.0: historical prototype</title><desc id="d">Historical PyTorch prototype banner in Prism's current charcoal and lavender presentation style. A terminal illustration distinguishes it from the current Windows product.</desc><rect width="1200" height="400" rx="20" fill="#0f0e15"/><g font-family="Segoe UI, Arial, sans-serif"><text x="52" y="64" fill="#ece9f5" font-size="28" font-weight="700">Prism</text><text x="143" y="64" fill="#b4afc6" font-size="11" letter-spacing="2">PROJECT ARCHIVE</text><text x="50" y="151" fill="#ece9f5" font-family="Georgia, serif" font-size="44">Where it started.</text><text x="50" y="205" fill="#ece9f5" font-family="Georgia, serif" font-size="44">A model to explore.</text><text x="52" y="253" fill="#b4afc6" font-size="17">An educational PyTorch Transformer.</text><rect x="52" y="291" width="112" height="36" rx="8" fill="#9d86ff"/><text x="108" y="314" text-anchor="middle" fill="#130d2e" font-size="16">v1.0.0</text><text x="183" y="314" fill="#b4afc6" font-size="12">HISTORICAL PROTOTYPE</text><text x="52" y="369" fill="#b4afc6" font-size="12">NOT THE CURRENT WINDOWS CHAT AND STUDIO PRODUCT.</text><rect x="554" y="36" width="600" height="328" rx="14" fill="#16151e" stroke="#2a2837"/><path d="M554 83H1154" stroke="#2a2837"/><text x="578" y="65" fill="#b4afc6" font-size="12">Prism / Prototype archive</text><text x="582" y="125" fill="#9d86ff" font-size="10" letter-spacing="2">CHARACTER-LEVEL TRAINING / TERMINAL CHAT</text><rect x="578" y="146" width="552" height="160" rx="10" fill="#0f0e15" stroke="#2a2837"/><g font-family="Consolas, monospace" font-size="18"><text x="601" y="185" fill="#9d86ff">$ python train.py</text><text x="601" y="229" fill="#ece9f5">$ python generate.py</text><text x="601" y="273" fill="#9d86ff">$ python chat.py</text></g><text x="582" y="337" fill="#b4afc6" font-size="13">Train / generate / experiment</text><text x="1148" y="385" text-anchor="end" fill="#b4afc6" font-size="10">ARCHIVE ILLUSTRATION / NOT ORIGINAL UI</text></g></svg>
