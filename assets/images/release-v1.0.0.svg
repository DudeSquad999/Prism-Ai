<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d"><title id="t">Prism AI v1.0.0: terminal prototype</title><desc id="d">Historical terminal-first PyTorch prototype. Python training and chat commands are shown in a schematic terminal, not an original screenshot.</desc><rect width="1200" height="400" rx="18" fill="#0f0e15"/><g font-family="Consolas, monospace"><text x="48" y="61" fill="#9d86ff" font-size="16">PRISM / PROJECT ARCHIVE</text><text x="44" y="143" fill="#ece9f5" font-size="49" font-weight="700">Prism v1.0.0</text><text x="48" y="194" fill="#ece9f5" font-size="25">It started in the terminal.</text><text x="48" y="236" fill="#b4afc6" font-size="15">A character-level Transformer in PyTorch.</text><rect x="48" y="272" width="189" height="34" rx="6" fill="#1d1b27" stroke="#2a2837"/><text x="63" y="294" fill="#9d86ff" font-size="13">HISTORICAL PROTOTYPE</text><text x="48" y="352" fill="#b4afc6" font-size="13">TRAIN / GENERATE / CHAT</text><text x="48" y="377" fill="#b4afc6" font-size="11">Not the Windows Chat and Studio applications.</text><rect x="560" y="40" width="592" height="300" rx="10" fill="#09090e" stroke="#2a2837"/><path d="M560 82H1152" stroke="#2a2837"/><text x="581" y="66" fill="#b4afc6" font-size="13">Prism / Python terminal</text><text x="588" y="124" fill="#9d86ff" font-size="17">&gt; python train.py --steps 2000</text><text x="588" y="157" fill="#b4afc6" font-size="13">Train the prototype model</text><text x="588" y="200" fill="#ece9f5" font-size="17">&gt; python generate.py --prompt "Hi"</text><text x="588" y="233" fill="#b4afc6" font-size="13">Generate text from a prompt</text><text x="588" y="276" fill="#9d86ff" font-size="17">&gt; python chat.py</text><text x="588" y="309" fill="#b4afc6" font-size="13">Open interactive terminal chat</text><text x="1152" y="377" text-anchor="end" fill="#b4afc6" font-size="10">COMMAND ILLUSTRATION / NOT ORIGINAL UI</text></g></svg>
