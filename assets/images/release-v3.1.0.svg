<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d"><title id="t">Prism AI v3.1.0: Windows EXE installer</title><desc id="d">Windows research and writing release distributed as Prism-3.1.0.exe, with Chat and Studio. The download and application cards are a schematic, not an installer screenshot.</desc><rect width="1200" height="400" rx="18" fill="#0f0e15"/><g font-family="Segoe UI, Arial, sans-serif"><text x="48" y="61" fill="#ece9f5" font-size="28" font-weight="700">Prism</text><text x="145" y="61" fill="#b4afc6" font-size="11" letter-spacing="2">AI WORKSPACE</text><text x="46" y="142" fill="#ece9f5" font-family="Georgia, serif" font-size="43">One Windows installer.</text><text x="46" y="195" fill="#ece9f5" font-family="Georgia, serif" font-size="43">Two workspaces.</text><text x="48" y="240" fill="#b4afc6" font-size="17">Your research. Your writing. Your AI.</text><rect x="48" y="272" width="108" height="34" rx="8" fill="#9d86ff"/><text x="102" y="295" text-anchor="middle" fill="#130d2e" font-size="16">v3.1.0</text><text x="176" y="295" fill="#b4afc6" font-size="12">WINDOWS / EXE INSTALLER</text><text x="48" y="352" fill="#b4afc6" font-size="13">DOWNLOAD / VERIFY / INSTALL / CONFIGURE AI</text><rect x="560" y="40" width="592" height="300" rx="12" fill="#16151e" stroke="#2a2837"/><path d="M560 82H1152" stroke="#2a2837"/><text x="582" y="66" fill="#b4afc6" font-size="12">Prism / Windows release package</text><rect x="582" y="103" width="548" height="90" rx="10" fill="#1d1b27" stroke="#2a2837"/><rect x="600" y="121" width="50" height="50" rx="8" fill="#9d86ff"/><text x="625" y="153" text-anchor="middle" fill="#130d2e" font-size="15" font-weight="700">EXE</text><text x="668" y="141" fill="#ece9f5" font-size="23">Prism-3.1.0.exe</text><text x="668" y="169" fill="#b4afc6" font-size="13">Verify the published SHA-256 before running.</text><path d="M856 193V211M856 211H720V230M856 211H996V230" fill="none