<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d"><title id="t">Prism AI 2.0.0: archived release</title><desc id="d">Archived Windows release banner using Prism's charcoal and lavender styling, with Chat, Studio, and the historical ZIP package name.</desc><rect width="1200" height="400" rx="20" fill="#0f0e15"/><g font-family="Segoe UI, Arial, sans-serif"><text x="52" y="64" fill="#ece9f5" font-size="28" font-weight="700">Prism</text><text x="143" y="64" fill="#b4afc6" font-size="11" letter-spacing="2">AI WORKSPACE</text><text x="50" y="151" fill="#ece9f5" font-family="Georgia, serif" font-size="44">Chat and Studio.</text><text x="50" y="205" fill="#ece9f5" font-family="Georgia, serif" font-size="44">One Windows setup.</text><text x="52" y="253" fill="#b4afc6" font-size="17">An earlier chapter of Prism.</text><rect x="52" y="291" width="112" height="36" rx="8" fill="#9d86ff"/><text x="108" y="314" text-anchor="middle" fill="#130d2e" font-size="16">v2.0.0</text><text x="183" y="314" fill="#b4afc6" font-size="12" letter-spacing="1">ARCHIVED RELEASE</text><text x="52" y="369" fill="#b4afc6" font-size="12">FOR NEW INSTALLATIONS, CHOOSE THE LATEST RELEASE.</text><rect x="554" y="36" width="600" height="328" rx="14" fill="#16151e" stroke="#2a2837"/><path d="M554 83H1154" stroke="#2a2837"/><text x="578" y="65" fill="#b4afc6" font-size="12">Prism / Release archive</text><text x="582" y="131" fill="#9d86ff" font-size="10" letter-spacing="2">WINDOWS SETUP PACKAGE</text><text x="580" y="173" fill="#ece9f5" font-family="Georgia, serif" font-size="29">PrismV2.0.0.zip</text><rect x="578" y="198" width="264" height="88" rx="10" fill="#1d1b27" stroke="#2a2837"/><text x="597" y="233" fill="#ece9f5" font-size="20">Prism Chat</text><text x="597" y="262" fill="#b4afc6" font-size="12">Research and Markdown</text><rect x="858" y="198" width="272" height="88" rx="10" fill="#1d1b27" stroke="#2a2837"/><text x="877" y="23