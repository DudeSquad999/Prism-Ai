<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d"><title id="t">Prism AI v2.0.0: batch-file Windows setup</title><desc id="d">Archived Windows release installed by extracting PrismV2.0.0.zip and running Install Prism.bat. File and command panels are illustrative.</desc><rect width="1200" height="400" rx="18" fill="#0f0e15"/><g font-family="Segoe UI, Arial, sans-serif"><text x="48" y="61" fill="#ece9f5" font-size="28" font-weight="700">Prism</text><text x="145" y="61" fill="#b4afc6" font-size="11" letter-spacing="2">RELEASE ARCHIVE</text><text x="46" y="142" fill="#ece9f5" font-family="Georgia, serif" font-size="43">Extract. Run the batch.</text><text x="46" y="195" fill="#ece9f5" font-family="Georgia, serif" font-size="43">Start your workspace.</text><text x="48" y="240" fill="#b4afc6" font-size="17">Chat and Studio through Windows setup.</text><rect x="48" y="272" width="108" height="34" rx="8" fill="#9d86ff"/><text x="102" y="295" text-anchor="middle" fill="#130d2e" font-size="16">v2.0.0</text><text x="176" y="295" fill="#b4afc6" font-size="12">ARCHIVED / BATCH-FILE SETUP</text><text x="48" y="352" fill="#b4afc6" font-size="13">DOWNLOAD ZIP / EXTRACT / RUN .BAT</text><text x="48" y="377" fill="#b4afc6" font-size="11">For new installations, choose the latest release.</text><rect x="560" y="40" width="592" height="300" rx="12" fill="#16151e" stroke="#2a2837"/><path d="M560 82H1152" stroke="#2a2837"/><text x="582" y="66" fill="#b4afc6" font-size="12">PrismV2.0.0.zip / extracted folder</text><g font-family="Consolas, monospace" font-size="17"><text x="586" y="121" fill="#b4afc6">READ ME FIRST.txt</text><rect x="578" y="138" width="556" height="40" rx="7" fill="#9d86ff" fill-opacity=".13" stroke="#9d86ff"/><text x="594" y="165" fill="#9d86ff">Install Prism.bat</text><text x="586" y="209" fill="#b4afc6">setup/</text></g><rect x="580" y="231" width="552" height="82" rx="8" fill="#0f0e15" stroke="#2a2837"/><text x="596" y="260" fill="#ece9f5" font-family="Consolas, monospace" font-size="16">&gt; "Install Prism.bat"</text><text x="596" y="290" fill="#b4afc6" font-size="13">Run from the extracted folder, not inside the ZIP.</text><text x="1152" y="377" text-anchor="end" fill="#b4afc6" font-size="10">SETUP FLOW ILLUSTRATION / NOT ORIGINAL UI</text></g></svg>
