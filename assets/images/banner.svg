<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d"><title id="t">Prism AI workspace</title><desc id="d">Charcoal and lavender Prism wordmark banner with an illustrative project sidebar and writing panel, not an application screenshot.</desc><rect width="1200" height="400" rx="20" fill="#0f0e15"/><g font-family="Segoe UI, Arial, sans-serif"><text x="52" y="64" fill="#ece9f5" font-size="28" font-weight="700">Prism</text><text x="143" y="64" fill="#b4afc6" font-size="11" letter-spacing="2">AI WORKSPACE</text><text x="50" y="155" fill="#ece9f5" font-family="Georgia, serif" font-size="43">Your research.</text><text x="50" y="208" fill="#ece9f5" font-family="Georgia, serif" font-size="43">Your writing. Your AI.</text><text x="52" y="254" fill="#b4afc6" font-size="17">A connected space for research and writing.</text><rect x="52" y="290" width="136" height="36" rx="8" fill="#9d86ff"/><text x="120" y="313" text-anchor="middle" fill="#130d2e" font-size="13">Chat + Studio</text><text x="52" y="369" fill="#b4afc6" font-size="12">MARKDOWN / LATEX / LOCAL AND CLOUD AI</text><rect x="554" y="36" width="600" height="328" rx="14" fill="#16151e" stroke="#2a2837"/><path d="M726 36V364M726 83H1154" stroke="#2a2837"/><text x="575" y="68" fill="#ece9f5" font-size="18" font-weight="700">Prism</text><rect x="570" y="94" width="140" height="32" rx="8" fill="#9d86ff"/><text x="640" y="115" text-anchor="middle" fill="#130d2e" font-size="12">+ New chat</text><text x="580" y="157" fill="#b4afc6" font-size="12">Home</text><rect x="570" y="173" width="140" height="30" rx="8" fill="#9d86ff" fill-opacity=".12"/><text x="580" y="193" fill="#9d86ff" font-size="12">Projects</text><text x="580" y="235" fill="#b4afc6" font-size="10" letter-spacing="1">RESEARCH NOTES</text><path d="M581 254H689M581 276H668M581 298H680" stroke="#2a2837" stroke-width="5" stroke-linecap="round"/><text x="748" y="65" fill="#b4afc6" font-size="11">Prism / Research</text><text x="756" y="132" fill="#9d86ff" font-size="10" letter-spacing="2">RESEARCH TO WRITING</text><text x="754" y="174" fill="#ece9f5" font-family="Georgia, serif" font-size="28">A place for your next idea.</text><text x="756" y="206" fill="#b4afc6" font-size="13">Questions, context, and drafts in one workspace.</text><rect x="754" y="230" width="374" height="57" rx="10" fill="#1d1b27" stroke="#2a2837"/><path d="M771 249H1084M771 266H1025" stroke="#514c66" stroke-width="4" stroke-linecap="round"/><rect x="754" y="303" width="374" height="37" rx="10" fill="#0f0e15" stroke="#2a2837"/><text x="768" y="326" fill="#b4afc6" font-size="12">Message Prism about your research or draft...</text><text x="1148" y="385" text-anchor="end" fill="#b4afc6" font-size="10">WORKSPACE ILLUSTRATION</text></g></svg>
