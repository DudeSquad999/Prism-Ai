<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Prism AI research and writing workspace</title>
  <desc id="desc">A dark technical schematic connecting research questions, source material, Prism Chat, Prism Studio, LaTeX, and PDF output through a central prism mark.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0d19"/>
      <stop offset="0.55" stop-color="#11182b"/>
      <stop offset="1" stop-color="#17132b"/>
    </linearGradient>
    <linearGradient id="prism" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8affd4"/>
      <stop offset="0.48" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#f2c76e"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9da9ce" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="400" rx="28" fill="url(#background)"/>
  <rect width="1200" height="400" rx="28" fill="url(#grid)"/>
  <path d="M0 320C180 260 260 370 440 310S760 210 930 280 1100 350 1200 300" fill="none" stroke="#8b7cff" stroke-opacity=".14" stroke-width="2"/>
  <g fill="none" stroke="#8affd4" stroke-opacity=".58" stroke-width="2">
    <path d="M250 112H410L520 190"/>
    <path d="M250 200H430L520 200"/>
    <path d="M250 288H410L520 210"/>
    <path d="M680 200L790 112H950"/>
    <path d="M680 200H950"/>
    <path d="M680 210L790 288H950"/>
  </g>
  <g fill="#8affd4">
    <circle cx="410" cy="112" r="4"/><circle cx="430" cy="200" r="4"/><circle cx="410" cy="288" r="4"/>
    <circle cx="790" cy="112" r="4"/><circle cx="790" cy="288" r="4"/>
  </g>
  <g font-family="Inter, Segoe UI, sans-serif">
    <text x="72" y="82" fill="#8affd4" font-size="14" font-weight="700" letter-spacing="4">RESEARCH TO WRITING</text>
    <text x="72" y="132" fill="#f3f5ff" font-size="42" font-weight="700">Prism AI</text>
    <text x="72" y="164" fill="#aeb8d6" font-size="17">A connected workspace for ideas, evidence, and documents.</text>
    <g fill="#f3f5ff" font-size="13" font-weight="700" letter-spacing="1.6">
      <text x="72" y="105">01 / INPUT</text>
      <text x="72" y="193">02 / EVIDENCE</text>
      <text x="72" y="281">03 / NOTES</text>
      <text x="968" y="105">04 / RESEARCH</text>
      <text x="968" y="193">05 / AUTHORING</text>
      <text x="968" y="281">06 / OUTPUT</text>
    </g>
    <g fill="#aeb8d6" font-size="15">
      <text x="72" y="125">Questions and ideas</text>
      <text x="72" y="213">Sources and references</text>
      <text x="72" y="301">Structured Markdown</text>
      <text x="968" y="125">Prism Chat</text>
      <text x="968" y="213">Prism Studio / LaTeX</text>
      <text x="968" y="301">Compiled PDF</text>
    </g>
  </g>
  <g filter="url(#glow)">
    <path d="M600 110L680 200L600 290L520 200Z" fill="#8b7cff" fill-opacity=".16" stroke="url(#prism)" stroke-width="3"/>
    <path d="M600 110L600 290L680 200Z" fill="#8affd4" fill-opacity=".12"/>
    <path d="M520 200L600 110L600 290Z" fill="#8b7cff" fill-opacity=".18"/>
  </g>
  <path d="M600 110V290M520 200H680" stroke="#f3f5ff" stroke-opacity=".24" stroke-width="1.5"/>
  <text x="600" y="210" text-anchor="middle" fill="#f3f5ff" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="800" letter-spacing="2">PRISM</text>
  <text x="600" y="356" text-anchor="middle" fill="#8f9aba" font-family="Inter, Segoe UI, sans-serif" font-size="12" letter-spacing="3">LOCAL CONTROL  /  SOURCE CONTEXT  /  DOCUMENT OUTPUT</text>
</svg>
