title: "Show and tell: "
body:
  - type: markdown
    attributes:
      value: "Share a project, workflow, or lesson related to Prism AI. Remove personal information, API keys, and private data from screenshots."
  - type: textarea
    id: share
    attributes:
      label: What are you sharing?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Which component and version did you use?
      description: If this is a mockup or concept rather than a working feature, label it clearly.
  - type: textarea
    id: feedback
    attributes:
      label: What feedback would be useful?
