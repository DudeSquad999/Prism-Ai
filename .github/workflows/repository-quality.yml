name: Repository quality (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-checks:
    name: Validate repository links and tooling
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check browser demo JavaScript syntax
        run: node --check demo.js

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test repository checker
        run: python -m unittest discover -s tests -v

      - name: Check local references
        run: python scripts/check_repo.py
