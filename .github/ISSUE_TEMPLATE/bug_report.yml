name: Bug report
description: Report a problem with Prism Chat, Prism Studio, or the Windows installer.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Please remove API keys, private research, and personal information before submitting.
  - type: dropdown
    id: application
    attributes:
      label: Application
      options:
        - Prism Chat
        - Prism Studio
        - Windows installer
        - Browser demo
        - Other / not sure
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: For example, Windows 11 23H2.
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - Windows .exe installer from Releases
        - Source package
        - Browser demo
        - Other / not sure
    validations:
      required: true
  - type: dropdown
    id: ai-provider
    attributes:
      label: AI provider or local model
      options:
        - Ollama / local model
        - Google Gemini
        - Anthropic
        - OpenAI
        - Not configured
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Tell us exactly what you did before the problem occurred.
      placeholder: |
        1. Open Prism Chat
        2. Create a project
        3. Ask a question
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant error messages or screenshots
      description: Remove API keys, private conversations, and personal information first.
    validations:
      required: false
