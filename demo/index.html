<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f0e15"><title>Prism — Interactive demo</title><style>
:root{font-family:'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;font-size:14px;--bg:#0f0e15;--surface:#16151e;--raised:#1d1b27;--border:#2a2837;--text:#ece9f5;--muted:#b4afc6;--accent:#9d86ff;--ink:#130d2e;--soft:rgba(157,134,255,.13)}
[data-theme=light]{--bg:#f6f5f9;--surface:#fff;--raised:#f2f0f7;--border:#e4e1ec;--text:#18152a;--muted:#514c66;--accent:#5638d1;--ink:#fff;--soft:#efebff;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}button,a,input,textarea,select{outline-offset:3px} :focus-visible{outline:2px solid var(--accent)}button{background:var(--raised);border:1px solid var(--border);border-radius:8px;padding:8px 12px}button:hover{border-color:var(--accent)}.primary{background:var(--accent);color:var(--ink);border-color:transparent}.app{display:grid;grid-template-columns:244px minmax(0,1fr);height:100dvh}.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 12px;overflow:auto}.brand{display:flex;align-items:center;gap:10px;padding:0 9px 22px;font-size:21px;font-weight:700}.brand small{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400}.mark{color:var(--accent);font-size:30px}.actions{display:flex;gap:7px}.actions button{flex:1;padding:8px}.search{width:100%;text-align:left;margin:12px 0;color:var(--muted);background:transparent}.search span{float:right;font-size:11px}nav{display:grid;gap:3px}nav button{border-color:transparent;background:none;text-align:left;display:flex;gap:12px;align-items:center;color:var(--muted)}nav button i{width:18px;font-style:normal;text-align:center}nav button.active{color:var(--accent);background:var(--soft)}.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin:24px 10px 8px}.recent{background:none;border:0;text-align:left;color:var(--muted);font-size:13px}.sidefoot{margin-top:auto;padding:24px 8px 0;color:var(--muted);font-size:12px;line-height:1.7}.dot{color:#ffc35c}.main{min-width:0;display:flex;flex-direction:column}.topbar{min-height:56px;border-bottom:1px solid var(--border);padding:10px 22px;display:flex;align-items:center;gap:10px}.crumb{color:var(--muted)}.spacer{flex:1}.pill{font-size:11.5px;border-radius:30px;padding:5px 10px;background:var(--raised);border:1px solid var(--border);color:var(--muted)}.workspace{display:flex;min-height:0;flex:1}.content{flex:1;min-width:0;display:flex;flex-direction:column}.view{overflow:auto;flex:1;padding:36px clamp(20px,4vw,65px)}.page{max-width:980px;margin:auto}h1,h2{font-family:Georgia,serif;font-weight:400}h1{font-size:34px;margin:6px 0 12px;line-height:1.2}h2{font-size:23px;margin:0 0 14px}h3{font-size:14px;margin:0 0 9px}p{line-height:1.65;color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin-bottom:20px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:18px 0 28px}.card{border:1px solid var(--border);border-radius:14px;padding:20px;background:var(--surface)}.card p{font-size:13px;margin:7px 0 16px}.card .tiny,.tiny{font-size:12px;color:var(--muted)}.row{display:flex;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--border)}.row:first-of-type{border-top:0}.row button{margin-left:auto;font-size:12px}.notice{border:1px solid var(--border);border-radius:10px;padding:11px 14px;font-size:12px;color:var(--muted);line-height:1.6;background:var(--raised)}.panel{width:300px;border-left:1px solid var(--border);background:var(--surface);padding:16px;overflow:auto}.tabs{display:flex;gap:2px;overflow:auto;border-bottom:1px solid var(--border);margin-bottom:22px}.tabs button{border:0;border-radius:0;background:none;padding:9px 6px;font-size:12px;color:var(--muted)}.tabs button.active{color:var(--accent);border-bottom:2px solid var(--accent)}.panel h3{margin-top:24px}.panel p{font-size:13px}.composer-wrap{padding:14px clamp(18px,4vw,65px) 18px;max-width:1100px;width:100%;margin:auto}.modes{display:flex;gap:4px;margin-bottom:9px;flex-wrap:wrap}.modes button{border:0;background:none;color:var(--muted);font-size:12px;padding:6px 10px}.modes button.active{background:var(--soft);color:var(--accent)}.composer{display:flex;gap:12px;border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:12px}.composer:focus-within{border-color:var(--accent)}textarea{resize:vertical;min-height:48px;max-height:160px;flex:1;width:100%;border:0;background:none;outline:none!important;line-height:1.5}.send{align-self:flex-end;background:var(--accent);color:var(--ink);font-size:18px;padding:6px 12px}.composer-foot{display:flex;gap:12px;align-items:center;margin-top:9px;font-size:11px;color:var(--muted);flex-wrap:wrap}.composer-foot button,.composer-foot select{font-size:11px;background:none;border:0;padding:2px}.message{max-width:760px;margin:0 auto 28px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}.message .who{font-size:12px;color:var(--accent);font-weight:600;margin-bottom:8px}.message.user{padding:15px 18px;background:var(--raised);border:1px solid var(--border);border-radius:14px}.message.user .who{color:var(--muted)}.message .tools{margin-top:12px}.message .tools button{font-size:11px;padding:4px 8px;background:none;color:var(--muted)}label.field{display:grid;gap:8px;margin:18px 0;color:var(--muted);font-size:13px}input,select{background:var(--raised);border:1px solid var(--border);border-radius:8px;padding:9px}dialog{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:16px;width:min(520px,calc(100% - 30px));padding:24px}dialog::backdrop{background:#05040caa}dialog .close{float:right}.mobile{display:none}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:10px;z-index:60;max-width:90vw} [hidden]{display:none!important}.skip{position:fixed;top:-80px;left:10px;padding:10px;background:var(--accent);color:var(--ink);z-index:100}.skip:focus{top:10px}
@media(max-width:1150px){.panel{display:none}.panel.open{display:block;position:fixed;right:0;top:56px;bottom:0;z-index:20;box-shadow:-20px 0 60px #0005;width:min(350px,100vw)}}@media(min-width:1151px){.panel.collapsed{display:none}}@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{display:none}.sidebar.open{display:flex;position:fixed;inset:0 auto 0 0;width:260px;z-index:30;box-shadow:20px 0 80px #0008}.mobile{display:inline-block}.topbar{padding:10px 12px}.topbar .memory{display:none}.view{padding:28px 20px}h1{font-size:29px}.grid{grid-template-columns:1fr}.composer-wrap{padding:12px}.crumb{font-size:12px}.pill{font-size:10px}.brand{padding-bottom:14px}}
</style></head><body><a class="skip" href="#view">Skip to workspace</a><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><span class="mark" aria-hidden="true">△</span>Prism<small>CHAT</small><button class="mobile" onclick="toggleMenu()" aria-label="Close navigation">×</button></div><div class="actions"><button class="primary" onclick="newChat()">+ New chat</button><button onclick="newProject()">+ Project</button></div><button class="search" onclick="searchDemo()">Search <span>Ctrl K</span></button><nav id="nav" aria-label="Main navigation"></nav><div class="label">Recent</div><button class="recent" onclick="sample()">A clearer research workflow</button><div class="label">Projects</div><button class="recent" onclick="go('Projects')">◇ Sample research project</button><div class="sidefoot"><span class="dot">●</span> Scripted demo · No AI connected<br>No account or API key required.<br><button onclick="go('Settings')" style="margin-top:12px">Appearance & settings</button></div></aside><main class="main"><header class="topbar"><button class="mobile" onclick="toggleMenu()" aria-label="Open navigation">☰</button><span class="crumb">Prism / <span id="breadcrumb">Home</span></span><span class="spacer"></span><span class="pill">Scripted demo</span><button class="pill memory" onclick="go('My Prism')">Memory</button><button onclick="togglePanel()" aria-label="Toggle project panel">◫</button></header><div class="workspace"><div class="content"><section id="view" class="view" tabindex="-1"></section><div class="composer-wrap" id="compose" hidden><div class="modes" id="modes"></div><form class="composer" id="form"><textarea id="input" rows="2" aria-label="Message to Prism" placeholder="Ask anything…"></textarea><button class="send" type="submit" aria-label="Send message">↑</button></form><div class="composer-foot"><label>Length <select id="length" aria-label="Answer length"><option>Concise</option><option selected>Balanced</option><option>Detailed</option></select></label><button onclick="modal('What will be sent?', 'Nothing is sent to an AI or server. This demo uses fixed sample text. Your message stays in this page until you reload it.')">What will be sent?</button><span class="spacer"></span><span>Sample responses · Not live AI</span></div></div></div><aside class="panel" id="panel" aria-label="Project panel"><div class="tabs" id="tabs"></div><div id="panelContent"></div></aside></div></main></div><dialog id="dialog"><button class="close" onclick="document.getElementById('dialog').close()" aria-label="Close dialog">×</button><h2 id="dialogTitle"></h2><p id="dialogText"></p></dialog><div id="toast" class="toast" role="status" hidden></div><script>
const $=id=>document.getElementById(id);const names=['Home','Chat','Projects','Library','My Prism','AI choice','Teach Prism','AI profiles','Overnight','Settings'];const icons=['⌂','◌','◇','▤','◈','⌘','▧','☷','☾','⚙'];let current='Home',mode='Ask',messages=[],project='Sample research project',draft='',timer;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,3200)}
function modal(t,s){$('dialogTitle').textContent=t;$('dialogText').textContent=s;$('dialog').showModal()}
function toggleMenu(){$('sidebar').classList.toggle('open')}
function togglePanel(){if(innerWidth<=1150)$('panel').classList.toggle('open');else $('panel').classList.toggle('collapsed')}
function card(t,p,action,label){return `<article class="card"><h3>${t}</h3><p>${p}</p>${action?`<button onclick="${action}">${label||'Open'}</button>`:''}</article>`}
function newChat(){messages=[];go('Chat');$('input').focus()}
function newProject(){const n=prompt('Name your demo project');if(n&&n.trim()){project=n.trim().slice(0,100);go('Projects');toast('Project created for this session only.')}}
function sample(){messages=[{who:'You',text:'Help me turn a research question into a clear writing plan.'},{who:'Prism · scripted example',text:'Start with a focused question, then keep evidence and writing separate.

1. Define the question and audience.
2. Collect relevant sources in your project.
3. Review what each source actually supports.
4. Create an outline before writing a draft.
5. Check citations and revise.

This is a fixed interface example, not a live researched answer.'}];go('Chat')}
function go(name){current=name;$('breadcrumb').textContent=name;$('sidebar').classList.remove('open');$('nav').innerHTML=names.map((n,i)=>`<button class="${n===name?'active':''}" ${n===name?'aria-current="page"':''} onclick="go('${n}')"><i aria-hidden="true">${icons[i]}</i>${n}</button>`).join('');$('compose').hidden=name!=='Chat';let h='';
if(name==='Home')h=`<div class="eyebrow">Your workspace, your way</div><h1>Ask Prism anything,<br>or pick up where you left off.</h1><p>A place for your questions, research, and writing.</p><div class="toolbar"><button class="primary" onclick="newChat()">+ New chat</button><button onclick="newProject()">+ New project</button><button onclick="sample()">Explore sample project</button></div><div class="grid">${card('Continue your work','A clearer research workflow. Explore a sample conversation and its project context.','sample()','Continue →')}${card('AI status','No AI connected. This browser demo uses fixed examples, with no provider requests.',"go('AI choice')",'View AI choices')}</div><h2>Recent work</h2><div class="card"><div class="row"><div><h3>Sample research project</h3><span class="tiny">Research · Labeled sample content</span></div><button onclick="sample()">Open →</button></div><div class="row"><div><h3>From question to outline</h3><span class="tiny">Writing · Example draft</span></div><button onclick="go('Library')">View draft</button></div></div><div style="margin-top:24px" class="notice">Interactive browser preview. No live AI, web research, model downloads, or background jobs. Changes are session-only.</div>`;
else if(name==='Chat'){h=messages.length?messages.map((m,i)=>`<article class="message ${m.who==='You'?'user':''}"><div class="who">${esc(m.who)}</div><div>${esc(m.text)}</div>${m.who!=='You'?`<div class="tools"><button onclick="copyMessage(${i})">Copy</button><button onclick="toast('Feedback is a demo interaction; nothing was saved.')">Helpful</button></div>`:''}</article>`).join(''):`<div class="page" style="padding-top:10vh"><div class="eyebrow">Prism Chat</div><h1>What would you like to work on?</h1><p>Explore the interface with a scripted example.</p><div class="grid">${card('Plan a research project','See a question become a clear, practical outline.','sample()','Try sample →')}${card('Start writing','Explore Create mode and a sample draft.',"setCreate()",'Try Create →')}</div><div class="notice">Typing a message displays a fixed demonstration response. It does not generate an answer to your question.</div></div>`;}
else if(name==='Projects')h=`<h1>Projects</h1><p>Keep conversations, evidence, and drafts together.</p><div class="toolbar"><button class="primary" onclick="newProject()">+ New project</button></div><div class="grid">${card(esc(project),'Demo project · 1 sample conversation · 1 example draft','sample()','Continue in chat →')}</div>`;
else if(name==='Library')h=`<h1>Library</h1><p>Evidence, drafts, and documents across your projects.</p><div class="grid">${card('From question to outline','Example draft · Sample research project',"showDraft()",'Read draft')}${card('Evidence shelf','No real sources have been retrieved in this demo.',"modal('Evidence shelf','The real app can organize saved evidence. This static preview does not search or verify sources.')",'About evidence')}</div>`;
else if(name==='My Prism')h=`<h1>My Prism</h1><p>Make Prism fit the way you like to work.</p><div class="card"><h2>Personality & tone</h2><label class="field">Tone<select><option>Friendly</option><option>Professional</option><option>Casual</option><option>Simple</option><option>Detailed</option><option>Direct</option><option>Encouraging</option><option>Formal</option></select></label><label class="field">Response length<select><option>Medium</option><option>Short</option><option>Detailed</option></select></label><button class="primary" onclick="toast('Demo preferences selected. Nothing is persisted or sent.')">Approve demo preferences</button></div><div class="grid">${card('Writing style','Your samples and preferences should stay under your control.',"modal('Writing style','This preview does not collect writing samples or store memories.')",'Explore')}${card('Personal profiles','School, Work, Research, and Casual preference sets.',"go('AI profiles')",'View example profiles')}</div>`;
else if(name==='AI choice')h=`<h1>AI choice</h1><p>Choose how you want to work. No provider is connected in this demo.</p><div class="grid">${['Fast','Smart','Custom'].map((n,i)=>card(n,['Quick answers for everyday chat.','For research, writing, and longer work.','Choose your own model and provider.'][i],`choose('${n}')`,'Preview choice')).join('')}</div><div class="notice">Preview only: these choices do not connect AI, download models, or switch providers.</div>`;
else if(name==='Teach Prism')h=`<h1>Teach Prism</h1><p>Review the rules and examples you want Prism to use.</p><div class="card"><h3>Example rule</h3><p>Use clear language and explain technical terms.</p><span class="pill">Sample only · Not saved memory</span></div><div class="toolbar"><button onclick="modal('Add a rule','Rule creation is not connected in this browser preview. No teaching data is collected or saved.')">+ Explore teaching</button></div>`;
else if(name==='AI profiles')h=`<h1>AI profiles</h1><p>Example work profiles. No AI settings are changed.</p><div class="grid">${['School','Work','Research','Casual'].map(n=>card(n,'Explore a named preference set.',`choose('${n} profile')`,'Preview')).join('')}</div>`;
else if(name==='Overnight')h=`<h1>Overnight</h1><p>Preview a research job before approving it.</p><div class="card"><h3>Sample research briefing</h3><p>Status: draft example. No job is running.</p><div class="row">Sources <span class="spacer"></span>None approved</div><div class="row">Network requests <span class="spacer"></span>0</div><div class="row">AI requests <span class="spacer"></span>0</div><button onclick="modal('Preview only','Background research is not available in this static demo. No request was started, approved, or queued.')">Review example job</button></div>`;
else h=`<h1>Settings</h1><p>Appearance and information about this browser preview.</p><div class="card"><h2>Appearance</h2><div class="toolbar"><button onclick="theme('dark')">Dark theme</button><button onclick="theme('light')">Light theme</button></div><h2>Privacy</h2><p>This demo makes no AI or search requests. Messages and project names stay in page memory and reset when you reload. Do not enter sensitive information.</p><button onclick="location.reload()">Reset demo</button></div>`;
$('view').innerHTML=name==='Chat'?h:`<div class="page">${h}</div>`;if(name==='Chat')$('view').scrollTop=$('view').scrollHeight;else $('view').scrollTop=0;renderModes();}
function choose(n){toast(n+' selected for preview only. No AI connection changed.')}
function theme(n){document.documentElement.dataset.theme=n;toast('Theme changed for this session.')}
function setCreate(){mode='Create';newChat()}
function renderModes(){$('modes').innerHTML=['Ask','Research','Documents','Create'].map(n=>`<button type="button" class="${n===mode?'active':''}" aria-pressed="${n===mode}" onclick="mode='${n}';renderModes()">${n}</button>`).join('')}
function showDraft(){modal('Example draft',draft||'Research plan

Question: What do we want to understand?
Evidence: What material will we review?
Outline: Context, key findings, limitations, and next steps.

This is sample text, not an AI-generated document.')}
function panelTab(n){$('tabs').innerHTML=['Context','Sources','Tasks','Drafts','Docs'].map(t=>`<button class="${n===t?'active':''}" onclick="panelTab('${t}')">${t}</button>`).join('');const content={Context:'<h3>Sample research project</h3><p>A focused place to explore a question and develop a draft.</p><h3>Goal</h3><p>Move from a question to a clear, reviewable outline.</p><h3>Next action</h3><p>Review the sample conversation, then open the example draft.</p>',Sources:'<h3>Sources</h3><p>No sources retrieved. This preview does not perform web research or verification.</p>',Tasks:'<h3>Example checklist</h3><p><label><input type="checkbox"> Define the question</label></p><p><label><input type="checkbox"> Review evidence</label></p><p><label><input type="checkbox"> Build an outline</label></p><p class="tiny">Session-only sample checklist.</p>',Drafts:'<h3>Drafts</h3><p>From question to outline</p><button onclick="showDraft()">Open sample draft</button>',Docs:'<h3>Documents</h3><p>No documents uploaded. Document processing is not connected in this preview.</p>'};$('panelContent').innerHTML=content[n]}
async function copyMessage(i){try{await navigator.clipboard.writeText(messages[i].text);toast('Copied')}catch{modal('Copy message',messages[i].text)}}
function searchDemo(){modal('Search demo','Use the sidebar to explore Home, Chat, Projects, Library, My Prism, AI choice, Teach Prism, AI profiles, Overnight, and Settings. Full-text search is not connected in this preview.')}
$('form').addEventListener('submit',e=>{e.preventDefault();const text=$('input').value.trim();if(!text)return;messages.push({who:'You',text});const responses={Ask:'This is a scripted browser preview, not a live AI answer.

In the full app, this area holds your conversation. Try the sample research workflow to explore a complete example.',Research:'Research mode preview

A real workflow would gather sources, show what was retrieved, and let you review supporting evidence.

This demo has not searched the web. No citations, findings, or verification results were generated.',Documents:'Documents mode preview

This static demo has not uploaded or read any documents. In a connected app, this area can display an answer grounded in selected material.',Create:'Example outline

1. State the question
2. Explain the context
3. Review relevant evidence
4. Identify limitations
5. Suggest next steps

Fixed sample text — not generated from your message.'};messages.push({who:'Prism · scripted example',text:responses[mode]});if(mode==='Create')draft=responses.Create;$('input').value='';go('Chat')});
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit()}});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchDemo()}if(e.key==='Escape'){$('sidebar').classList.remove('open');$('panel').classList.remove('open')}});panelTab('Context');go('Home');
</script></body></html>
