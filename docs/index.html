'use strict';
const $=id=>document.getElementById(id);
const views=['Home','Chat','Projects','Library','My Prism','AI choice','Teach Prism','AI profiles','Overnight','Settings'];
const paths=['M3 9L10 3l7 6v8h-5v-5H8v5H3Z','M3 4h14v10H8l-5 3Z','M3 5h5l2 2h7v10H3Z','M4 3v14M9 3v14M14 3l3 14','M10 3v14M3 10h14','M5 5h10v10H5ZM10 1v4M10 15v4','M3 4h6l2 2h6v11h-6l-2-2H3Z','M3 5h14M3 10h14M3 15h14','M14 3A7 7 0 1 0 17 14 8 8 0 0 1 14 3Z','M10 3v3M10 14v3M3 10h3M14 10h3M5 5l2 2M13 13l2 2'];
let screen='Home',mode='Ask',tab='Context',active=0,toastTimer;
const projects=[{name:'Research workspace',messages:[],draft:'Research plan\n\n1. Define a focused question.\n2. Collect relevant evidence.\n3. Build an outline.\n4. Review limitations.\n5. Revise the draft.\n\nSample content, not a generated research finding.',tasks:[false,false,false],rules:[]}];
const prefs={tone:'Friendly',length:'Balanced'};
const current=()=>projects[active];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function show(name,focus=false){if(!views.includes(name))return;screen=name;$('crumb').textContent=name;$('sidebar').classList.remove('open');$('composerArea').hidden=name!=='Chat';navigation();const p=current();let h='';
if(name==='Home')h=`<div class="eyebrow">Your workspace, your way</div><h1>Ask Prism anything,<br>or pick up where you left off.</h1><p>A place for your questions, research, and writing.</p><div class="toolbar">${button('+ New chat','newchat','class="primary"')}${button('+ New project','newproject')}${button('Explore sample','sample')}</div><div class="grid">${card('Continue your work',p.name+' · '+p.messages.length+' messages in this session.','continue','Continue →')}${card('AI status','No model connected. Explore fixed examples without API keys or provider requests.','aichoice','View AI choices')}</div><h2>Your workspace</h2><div class="card"><div class="row"><div><h3>${esc(p.name)}</h3><span class="tiny">${p.tasks.filter(Boolean).length} of 3 sample tasks complete</span></div><span class="grow"></span>${button('Open project','projects')}</div><div class="row"><div><h3>From question to outline</h3><span class="tiny">Editable example draft</span></div><span class="grow"></span>${button('Open draft','draft')}</div></div><div class="notice" style="margin-top:22px">Browser preview. Chat answers are scripted. Project creation, task checkboxes, draft editing, and Markdown export work locally in this tab. Reloading resets the preview.</div>`;
else if(name==='Chat')h=p.messages.length?p.messages.map((m,i)=>`<article class="message ${m.role==='You'?'user':''}"><div class="who">${esc(m.role)}</div><div class="body">${esc(m.text)}</div>${m.role!=='You'?`<div class="tools">${button('Copy','copy',`data-index="${i}"`)}${button('Open draft','draft')}</div>`:''}</article>`).join(''):`<div class="page" style="padding-top:7vh"><div class="eyebrow">Prism Chat</div><h1>What would you like to work on?</h1><p>Pick an example to see the workflow in action.</p><div class="grid">${card('Plan a research project','Explore a sample conversation and a reviewable outline.','sample','Try example →')}${card('Write a first draft','Use Create mode to add a fixed sample outline to your project.','create','Try Create →')}</div><div class="notice">This preview cannot answer arbitrary questions. Your message is displayed locally alongside a fixed response.</div></div>`;
else if(name==='Projects')h=`<h1>Projects</h1><p>Keep each workflow in its own workspace.</p><div class="toolbar">${button('+ New project','newproject','class="primary"')}${button('Rename active project','rename')}</div><div class="grid">${projects.map((p,i)=>`<article class="card"><h3>${esc(p.name)}</h3><p>${p.messages.length} messages · ${p.tasks.filter(Boolean).length}/3 tasks complete</p><button data-project="${i}">Open workspace →</button></article>`).join('')}</div>`;
else if(name==='Library')h=`<h1>Library</h1><p>Review and edit the draft in ${esc(p.name)}.</p><div class="toolbar">${button('Export Markdown','export','class="primary"')}${button('Export conversation','exportchat')}</div><div class="card"><h2>From question to outline</h2><label class="field" for="draftEditor">Draft text</label><textarea id="draftEditor" class="editor" spellcheck="true">${esc(p.draft)}</textarea><div class="row"><span id="wordCount" class="tiny">${words(p.draft)} words · Changes stay in this tab</span></div></div><div class="notice" style="margin-top:18px">The draft editor is real. Its starting content is a sample, not researched evidence or live AI output.</div>`;

else if(name==='AI choice')h=`<h1>AI choice</h1><p>Preview the available setup categories.</p><div class="grid">${['Fast','Smart','Custom'].map((n,i)=>card(n,['Quick answers for everyday chat.','Research, writing, and longer work.','Choose your own model and provider.'][i],'connection','Explore setup')).join('')}</div><div class="notice">No runtime detection, model download, provider connection, or speed measurement is performed here.</div>`;
else if(name==='Teach Prism')h=`<h1>Teach Prism</h1><p>Try adding a session-only example rule.</p><div class="toolbar">${button('+ Add demo rule','rule','class="primary"')}</div><div class="card"><h3>Example rule</h3><p>Use clear language and explain technical terms.</p>${p.rules.map(r=>`<div class="row">${esc(r)}</div>`).join('')}<p class="tiny">Rules are displayed here only. They do not train a model or change scripted replies.</p></div>`;
else if(name==='AI profiles')h=`<h1>AI profiles</h1><p>Example work profiles, not connected model configurations.</p><div class="grid">${['School','Work','Research','Casual'].map(n=>card(n,'Preview a named preference set.','profile','Explore')).join('')}</div>`;
else if(name==='Overnight')h=`<h1>Overnight</h1><p>A transparent preview of a background research workflow.</p><div class="card"><h3>Example briefing</h3><p>Draft example. Nothing is running.</p><div class="row">Approved sources<span class="grow"></span>0</div><div class="row">Network requests<span class="grow"></span>0</div><div class="row">AI requests<span class="grow"></span>0</div>${button('About this preview','overnight')}</div>`;
else h=`<h1>Settings</h1><p>Appearance and privacy for this preview.</p><div class="card"><h2>Appearance</h2><div class="toolbar">${button('Dark','dark')}${button('Light','light')}</div><h2>Privacy</h2><p>The demo code makes no AI or search requests and does not save content to local storage. Project names, rules, preferences, messages, and drafts exist only in this tab until reload.</p><p class="tiny">Markdown export creates a file on your device. The hosting service may independently log visits. Do not enter sensitive content.</p>${button('Reset preview','reset')}</div>`;
$('view').innerHTML=name==='Chat'?h:`<div class="page">${h}</div>`;renderModes();renderPanel();$('view').scrollTop=name==='Chat'?$('view').scrollHeight:0;if(focus)$('view').focus();}
function words(t){return t.trim()?t.trim().split(/\s+/).length:0;}
function renderModes(){$('modes').innerHTML=['Ask','Research','Documents','Create'].map(n=>`<button data-mode="${n}" class="${n===mode?'active':''}" aria-pressed="${n===mode}">${n}</button>`).join('');}
function renderPanel(){const p=current();$('tabs').innerHTML=['Context','Sources','Tasks','Drafts','Docs'].map(n=>`<button data-tab="${n}" class="${n===tab?'active':''}" aria-pressed="${n===tab}">${n}</button>`).join('');const bodies={Context:`<h3>${esc(p.name)}</h3><p>Explore a question, organize your work, and build a draft.</p><h3>Next action</h3><p>Try the sample conversation, then edit its outline in Library.</p><h3>Session progress</h3><p>${p.tasks.filter(Boolean).length}/3 tasks complete · ${words(p.draft)} draft words</p>`,Sources:'<h3>Sources</h3><p>No sources retrieved. This demo does not search the web or verify citations.</p>',Tasks:`<h3>Project tasks</h3>${['Define the question','Review the sample outline','Revise the draft'].map((n,i)=>`<label class="task"><input type="checkbox" data-task="${i}" ${p.tasks[i]?'checked':''}>${n}</label>`).join('')}<p class="tiny">Task state survives navigation in this tab, not a reload.</p>`,Drafts:`<h3>Drafts</h3><p>From question to outline</p>${button('Edit draft','draft')}<div style="margin-top:8px">${button('Export Markdown','export')}</div>`,Docs:'<h3>Documents</h3><p>No documents loaded. File upload and document analysis are not connected in this preview.</p>'};$('panelBody').innerHTML=bodies[tab];}
function sample(){current().messages=[{role:'You',text:'Help me turn a research question into a clear writing plan.'},{role:'Prism · scripted example',text:`Start with a focused question, then separate evidence from writing.

1. Define the question and intended audience.
2. Collect relevant sources.
3. Review what each source supports.
4. Build an outline before writing.
5. Check citations and revise.

This is fixed example text. No research or source verification was performed.`}];show('Chat');}
function projectDialog(rename=false){dialog(rename?'Rename project':'New project',`<form id="projectForm"><label class="field">Project name<input id="projectName" maxlength="100" required value="${rename?esc(current().name):''}" autocomplete="off"></label><button class="primary" type="submit">${rename?'Rename':'Create project'}</button></form>`);$('projectName').focus();$('projectForm').onsubmit=e=>{e.preventDefault();const name=$('projectName').value.trim();if(!name)return;if(rename)current().name=name;else{projects.push({name,messages:[],draft:'',tasks:[false,false,false],rules:[]});active=projects.length-1;}$('dialog').close();show('Projects');toast('Project updated for this tab only.');};}
function download(name,text){const url=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function search(){dialog('Search screens and projects','<label class="field">Search<input id="searchInput" type="search" placeholder="Try Library or a project name"></label><div id="results" class="results"></div>');function update(){const q=$('searchInput').value.toLowerCase();const screens=views.filter(n=>n.toLowerCase().includes(q)).map(n=>`<button data-view="${n}" data-dismiss="true">${n}</button>`);const ps=projects.map((p,i)=>p.name.toLowerCase().includes(q)?`<button data-project="${i}" data-dismiss="true">Project: ${esc(p.name)}</button>`:'');$('results').innerHTML=screens.concat(ps).join('')||'<p>No matches.</p>';}$('searchInput').oninput=update;update();$('searchInput').focus();}
const actions={menu:()=>$('sidebar').classList.toggle('open'),panel:()=>{if(innerWidth<=1150)$('panel').classList.toggle('open');else $('panel').classList.toggle('collapsed');},close:()=>$('dialog').close(),newchat:()=>{current().messages=[];$('input').value='';show('Chat');$('input').focus();},newproject:()=>projectDialog(),rename:()=>projectDialog(true),search,sample,continue:()=>show('Chat'),projects:()=>show('Projects'),draft:()=>show('Library'),aichoice:()=>show('AI choice'),create:()=>{mode='Create';show('Chat');$('input').value='Create a sample research outline';$('input').focus();},privacy:()=>info('What will be sent?','Nothing is sent to an AI or server. Your text stays in page memory. Responses are fixed examples, not answers generated from your question.'),connection:()=>info('Connection preview','Live AI setup belongs to the application. No provider is contacted and no model is downloaded by this demo.'),profile:()=>info('Profile preview','This card illustrates a possible work profile. It does not select or connect an AI model.'),overnight:()=>info('Overnight preview','No research job is started, approved, scheduled, or simulated as complete. This is an interface preview only.'),prefs:()=>{prefs.tone=$('tone').value;prefs.length=$('length').value;toast('Preferences approved in this tab. Scripted replies stay unchanged.');},dark:()=>document.documentElement.dataset.theme='dark',light:()=>document.documentElement.dataset.theme='light',export:()=>{download('prism-draft.md',current().draft);toast('Draft export requested.');},exportchat:()=>{download('prism-conversation.md',current().messages.map(m=>'## '+m.role+'\n\n'+m.text).join('\n\n'));},rule:()=>{dialog('Add demo rule','<form id="ruleForm"><label class="field">Example rule<input id="ruleText" maxlength="300" required placeholder="Use concise explanations"></label><button class="primary" type="submit">Add to this tab</button></form>');$('ruleText').focus();$('ruleForm').onsubmit=e=>{e.preventDefault();const r=$('ruleText').value.trim();if(!r)return;current().rules.push(r);$('dialog').close();show('Teach Prism');};},reset:()=>{if(confirm('Reset all session-only projects, messages, drafts, and preferences?'))location.reload();},copy:async b=>{const text=current().messages[Number(b.dataset.index)].text;try{await navigator.clipboard.writeText(text);toast('Copied.');}catch{info('Copy message',text);}}};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.dismiss)$('dialog').close();if(b.dataset.view)show(b.dataset.view,true);else if(b.dataset.project!==undefined){active=Number(b.dataset.project);show('Chat',true);}else if(b.dataset.mode){mode=b.dataset.mode;renderModes();}else if(b.dataset.tab){tab=b.dataset.tab;renderPanel();}else if(actions[b.dataset.action])actions[b.dataset.action](b);});
document.addEventListener('change',e=>{if(e.target.dataset.task!==undefined){current().tasks[Number(e.target.dataset.task)]=e.target.checked;if(screen==='Home')show(screen);else renderPanel();}});
document.addEventListener('input',e=>{if(e.target.id==='draftEditor'){current().draft=e.target.value;$('wordCount').textContent=words(e.target.value)+' words · Changes stay in this tab';renderPanel();}});
$('composer').onsubmit=e=>{e.preventDefault();const text=$('input').value.trim();if(!text)return;const response={Ask:'This is a fixed interface example, not a live AI answer.\n\nTry the sample research workflow or edit a draft in Library to explore the working parts of this preview.',Research:'Research mode preview\n\nNo search was performed. In a connected application this area can show retrieved sources and their limitations. This static demo does not provide researched findings or verified citations.',Documents:'Documents mode preview\n\nNo documents were uploaded or read. This static preview cannot answer questions from files.',Create:'Sample outline\n\n1. Define the question\n2. Explain the context\n3. Review evidence\n4. Identify limitations\n5. Propose next steps\n\nFixed sample content, not generated from your message.'}[mode];current().messages.push({role:'You',text},{role:'Prism · scripted example',text:response});if(mode==='Create')current().draft=response;$('input').value='';show('Chat');$('announce').textContent='Scripted response displayed. No AI request was made.';};
$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('composer').requestSubmit();}};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();search();}if(e.key==='Escape'){$('sidebar').classList.remove('open');$('panel').classList.remove('open');}});
show('Home');
</script></body></html>
